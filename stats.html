<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Mavericks - Status</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: "Malgun Gothic", sans-serif;
}

.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 16px;
}

h1 {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 12px;
}

.section {
  margin-top: 28px;
}

.section-title {
  font-size: 20px;
  font-weight: bold;
  padding-bottom: 6px;
  border-bottom: 1px solid #333;
  margin-bottom: 12px;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  font-size: 16px;
}

.row span:last-child {
  font-weight: bold;
}

.inventory-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  font-size: 16px;
}

.inventory-row span:last-child {
  opacity: 0.85;
}
</style>
</head>

<body>
<div class="container">
  <h1>플레이어 정보</h1>

  <div class="section">
    <div class="section-title">플레이어 정보</div>
    <div class="row"><span>이름</span><span id="name"></span></div>
    <div class="row"><span>직업</span><span id="job"></span></div>
    <div class="row"><span>레벨</span><span id="level"></span></div>
    <div class="row"><span>체력</span><span id="hp"></span></div>
    <div class="row"><span>공격력</span><span id="atk"></span></div>
    <div class="row"><span>방어력</span><span id="def"></span></div>
    <div class="row"><span>민첩성</span><span id="agi"></span></div>
    <div class="row"><span>마법력</span><span id="mag"></span></div>
    <div class="row"><span>MP</span><span id="mp"></span></div>
  </div>

  <div class="section">
    <div class="section-title">장착 장비</div>
    <div class="row"><span>헬멧</span><span id="helmet"></span></div>
    <div class="row"><span>장갑</span><span id="gloves"></span></div>
    <div class="row"><span>갑옷</span><span id="armor"></span></div>
    <div class="row"><span>부츠</span><span id="boots"></span></div>
  </div>

  <div class="section">
    <div class="section-title">소지 아이템</div>
    <div id="inventory"></div>
  </div>
</div>

  <script src="data.js"></script>

<script>
  
  const playerData = loadPlayerData();

document.getElementById("name").textContent = playerData.name;
document.getElementById("job").textContent = playerData.job;
document.getElementById("level").textContent = playerData.level;
document.getElementById("hp").textContent = playerData.stats.hp;
document.getElementById("atk").textContent = playerData.stats.attack;
document.getElementById("def").textContent = playerData.stats.defense;
document.getElementById("agi").textContent = playerData.stats.agility;
document.getElementById("mag").textContent = playerData.stats.magic;
document.getElementById("mp").textContent = playerData.stats.mp;

document.getElementById("helmet").textContent = playerData.equipment.helmet ?? "없음";
document.getElementById("gloves").textContent = playerData.equipment.gloves ?? "없음";
document.getElementById("armor").textContent = playerData.equipment.armor ?? "없음";
document.getElementById("boots").textContent = playerData.equipment.boots ?? "없음";

const inv = document.getElementById("inventory");
Object.entries(playerData.inventory).forEach(([name, count]) => {
  const div = document.createElement("div");
  div.className = "inventory-row";
  div.innerHTML = `<span>${name}</span><span>x${count}</span>`;
  inv.appendChild(div);
});
 const slots = ["helmet", "gloves", "armor", "boots"];

function refreshUI() {
  document.getElementById("hp").textContent = playerData.stats.hp;
  document.getElementById("atk").textContent = playerData.stats.attack;
  document.getElementById("def").textContent = playerData.stats.defense;
  document.getElementById("agi").textContent = playerData.stats.agility;
  document.getElementById("mag").textContent = playerData.stats.magic;
  document.getElementById("mp").textContent = playerData.stats.mp;

  slots.forEach(slot => {
    const el = document.getElementById(slot);
    el.textContent = playerData.equipment[slot] ?? "없음";
    el.onclick = () => openEquipMenu(slot);
  });
}

function openEquipMenu(slot) {
  const list = Object.entries(playerData.inventory)
    .filter(([name, count]) => count > 0 && name.includes(slotName(slot)));

  let msg = "장비 선택:\n";
  list.forEach(([name, count], i) => {
    msg += `${i + 1}. ${name} x${count}\n`;
  });
  msg += "0. 장착 해제";

  const sel = prompt(msg);
  if (sel === null) return;

  const idx = parseInt(sel);
  if (idx === 0) {
    playerData.equipment[slot] = null;
  } else if (list[idx - 1]) {
    playerData.equipment[slot] = list[idx - 1][0];
  }

  recalcStats(playerData);
  savePlayerData(playerData);
  refreshUI();
}

function slotName(slot) {
  return {
    helmet: "헬멧",
    gloves: "장갑",
    armor: "갑옷",
    boots: "부츠"
  }[slot];
} 

recalcStats(playerData);
refreshUI();
});
</script>
  
</body>
</html>
