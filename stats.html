<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Mavericks - Status</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body {
  margin: 0;
  font-family: "Malgun Gothic", sans-serif;
  background: black;
  color: white;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  height: 100vh;
}

#statusContainer {
  width: 90%;
  max-width: 420px;
  background: #111;
  border-radius: 10px;
  padding: 12px;
  margin-top: 20px;
  box-sizing: border-box;
}

h1 {
  text-align: center;
  font-size: 24px;
  margin-bottom: 15px;
}

.sectionTitle {
  margin: 18px 0 8px;
  font-size: 18px;
  border-bottom: 1px solid #444;
  padding-bottom: 4px;
}

/* 기본 정보 */
.basicInfo {
  display: flex;
  justify-content: space-between;
  background: #222;
  padding: 10px;
  border-radius: 6px;
  margin-bottom: 10px;
}

/* 능력치 */
.statRow {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid #333;
}

.statRow:last-child {
  border-bottom: none;
}

.statName {
  opacity: 0.85;
}

.statValue {
  font-weight: bold;
  color: #ffcc00;
}

/* 장비 */
.equipItem {
  display: flex;
  justify-content: space-between;
  background: #222;
  padding: 8px;
  border-radius: 6px;
  margin-bottom: 6px;
}

.equipSlot {
  opacity: 0.8;
}

.equipName {
  font-weight: bold;
}

/* 인벤토리 */
.inventoryItem {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid #333;
}

.inventoryItem:last-child {
  border-bottom: none;
}
</style>
</head>

<body>

<div id="statusContainer">
  <h1>STATUS</h1>

  <!-- 기본 정보 -->
  <div class="sectionTitle">플레이어 정보</div>
  <div class="basicInfo">
    <div>레벨</div>
    <div class="statValue" id="level"></div>
  </div>

  <!-- 능력치 -->
  <div class="sectionTitle">능력치</div>

  <div class="statRow"><div>HP</div><div class="statValue" id="hp"></div></div>
<div class="statRow"><div>공격력</div><div class="statValue" id="atk"></div></div>
<div class="statRow"><div>방어력</div><div class="statValue" id="def"></div></div>
<div class="statRow"><div>민첩성</div><div class="statValue" id="agi"></div></div>
<div class="statRow"><div>마법력</div><div class="statValue" id="mag"></div></div>
<div class="statRow"><div>MP</div><div class="statValue" id="mp"></div></div>
  </div>

  <!-- 장착 장비 -->
  <div class="sectionTitle">장착 장비</div>

  <div class="equipItem">
    <div class="equipSlot">헬멧</div>
    <div class="equipName" id="helmet"></div>
  </div>
  <div class="equipItem">
    <div class="equipSlot">장갑</div>
    <div class="equipName" id="gloves"></div>
  </div>
  <div class="equipItem">
    <div class="equipSlot">갑옷</div>
    <div class="equipName" id="armor"></div>
  </div>
  <div class="equipItem">
    <div class="equipSlot">부츠</div>
    <div class="equipName" id="boots"></div>
  </div>

  <!-- 소지 아이템 -->
  <div class="sectionTitle">소지 아이템</div>

  <div class="inventoryItem">
    <div>소형 에너지 탱크</div>
    <div>x3</div>
  </div>
  <div class="inventoryItem">
    <div>중형 에너지 탱크</div>
    <div>x0</div>
  </div>
  <div class="inventoryItem">
    <div>대형 에너지 탱크</div>
    <div>x0</div>
  </div>
  <div class="inventoryItem">
    <div>MP 탱크</div>
    <div>x0</div>
  </div>
  <div class="inventoryItem">
    <div>스페셜 탱크</div>
    <div>x0</div>
  </div>
  <div class="inventoryItem">
    <div>큐어 탱크</div>
    <div>x0</div>
  </div>

  <script>
if (!localStorage.getItem("playerData")) return;

const playerData = JSON.parse(localStorage.getItem("playerData"));

document.getElementById("level").textContent = "Lv. " + playerData.level;
document.getElementById("hp").textContent = playerData.stats.maxHP;
document.getElementById("atk").textContent = playerData.stats.attack;
document.getElementById("def").textContent = playerData.stats.defense;
document.getElementById("agi").textContent = playerData.stats.agility;
document.getElementById("mag").textContent = playerData.stats.magic;
document.getElementById("mp").textContent = playerData.stats.maxMP;

document.getElementById("helmet").textContent = playerData.equipment.helmet ?? "없음";
document.getElementById("gloves").textContent = playerData.equipment.gloves ?? "없음";
document.getElementById("armor").textContent = playerData.equipment.armor ?? "없음";
document.getElementById("boots").textContent = playerData.equipment.boots ?? "없음";
  </script>

  
</body>
</html>
