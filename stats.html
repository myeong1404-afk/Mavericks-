<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Mavericks - Status</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: "Malgun Gothic", sans-serif;
}

.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 12px;
}

h1 {
  text-align: center;
  margin-bottom: 16px;
}

h2 {
  border-bottom: 1px solid #444;
  padding-bottom: 4px;
  font-size: 18px;
  margin-top: 24px;
}

.item {
  background: #222;
  padding: 12px;
  border-radius: 6px;
  margin-top: 10px;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 16px;
}

.stat-row span:last-child {
  font-weight: bold;
}

.equip .stat-row span:last-child {
  cursor: pointer;
  color: #ffcc00;
}

.inventory-row {
  background: #222;
  padding: 10px;
  border-radius: 6px;
  margin-top: 8px;
  display: flex;
  justify-content: space-between;
  font-size: 16px;
}

.skill-row {
  background: #222;
  padding: 10px;
  border-radius: 6px;
  margin-top: 8px;
  font-size: 15px;
}
</style>
</head>

<body>
<div class="container">
  <h1>Status</h1>

  <h2>플레이어 정보</h2>
  <div class="item">
    <div class="stat-row"><span>이름</span><span id="name"></span></div>
    <div class="stat-row"><span>직업</span><span id="job"></span></div>
    <div class="stat-row"><span>레벨</span><span id="level"></span></div>
  </div>

  <h2>능력치</h2>
  <div class="item">
    <div class="stat-row"><span>체력</span><span id="hp"></span></div>
    <div class="stat-row"><span>공격력</span><span id="atk"></span></div>
    <div class="stat-row"><span>방어력</span><span id="def"></span></div>
    <div class="stat-row"><span>민첩성</span><span id="agi"></span></div>
    <div class="stat-row"><span>마법력</span><span id="mag"></span></div>
    <div class="stat-row"><span>MP</span><span id="mp"></span></div>
  </div>

  <h2>장착 장비</h2>
  <div class="item equip">
    <div class="stat-row"><span>헬멧</span><span id="helmet"></span></div>
    <div class="stat-row"><span>장갑</span><span id="gloves"></span></div>
    <div class="stat-row"><span>갑옷</span><span id="armor"></span></div>
    <div class="stat-row"><span>부츠</span><span id="boots"></span></div>
  </div>

  <h2>소지 아이템</h2>
  <div id="inventory"></div>

  <h2>스킬</h2>
<div id="skills"></div>
</div>

  <script src="data.js"></script>

<script>
  
  const playerData = loadPlayerData();

document.getElementById("name").textContent = playerData.name;
document.getElementById("job").textContent = playerData.job;
document.getElementById("level").textContent = playerData.level;
document.getElementById("hp").textContent = playerData.stats.hp;
document.getElementById("atk").textContent = playerData.stats.attack;
document.getElementById("def").textContent = playerData.stats.defense;
document.getElementById("agi").textContent = playerData.stats.agility;
document.getElementById("mag").textContent = playerData.stats.magic;
document.getElementById("mp").textContent = playerData.stats.mp;

document.getElementById("helmet").textContent = playerData.equipment.helmet ?? "없음";
document.getElementById("gloves").textContent = playerData.equipment.gloves ?? "없음";
document.getElementById("armor").textContent = playerData.equipment.armor ?? "없음";
document.getElementById("boots").textContent = playerData.equipment.boots ?? "없음";

const inv = document.getElementById("inventory");
Object.entries(playerData.inventory).forEach(([name, count]) => {
  const div = document.createElement("div");
  div.className = "inventory-row";
  div.innerHTML = `<span>${name}</span><span>x${count}</span>`;
  inv.appendChild(div);
  
const skillBox = document.getElementById("skills");

playerData.skills.forEach(skill => {
  const div = document.createElement("div");
  div.className = "skill-row";

  if (skill === "X 버스터") {
    div.textContent = "X 버스터 : X의 버스터, MP소모 0";
  }

  if (skill === "에너지 캡슐") {
    div.textContent = "에너지 캡슐 : 에너지의 캡슐을 둘러 파티의 체력을 회복한다";
  }

  skillBox.appendChild(div);
});
 const slots = ["helmet", "gloves", "armor", "boots"];

function refreshUI() {
  document.getElementById("hp").textContent = playerData.stats.hp;
  document.getElementById("atk").textContent = playerData.stats.attack;
  document.getElementById("def").textContent = playerData.stats.defense;
  document.getElementById("agi").textContent = playerData.stats.agility;
  document.getElementById("mag").textContent = playerData.stats.magic;
  document.getElementById("mp").textContent = playerData.stats.mp;

  slots.forEach(slot => {
    const el = document.getElementById(slot);
    el.textContent = playerData.equipment[slot] ?? "없음";
    el.onclick = () => openEquipMenu(slot);
  });
}

function openEquipMenu(slot) {
  const list = Object.entries(playerData.inventory)
    .filter(([name, count]) => count > 0 && name.includes(slotName(slot)));

  let msg = "장비 선택:\n";
  list.forEach(([name, count], i) => {
    msg += `${i + 1}. ${name} x${count}\n`;
  });
  msg += "0. 장착 해제";

  const sel = prompt(msg);
  if (sel === null) return;

  const idx = parseInt(sel);
  if (idx === 0) {
    playerData.equipment[slot] = null;
  } else if (list[idx - 1]) {
    playerData.equipment[slot] = list[idx - 1][0];
  }

  recalcStats(playerData);
  savePlayerData(playerData);
  refreshUI();
}

function slotName(slot) {
  return {
    helmet: "헬멧",
    gloves: "장갑",
    armor: "갑옷",
    boots: "부츠"
  }[slot];
} 

recalcStats(playerData);
refreshUI();
</script>
  
</body>
</html>
