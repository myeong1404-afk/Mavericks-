<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Mavericks - Stage Select</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body {
  margin: 0;
  background: url("images/Stage_select_1.jpg") no-repeat center center fixed;
  background-size: cover;
  color: white;
  font-family: "Malgun Gothic", sans-serif;
  min-height: 100vh;
}

#stageSelect {
  background: rgba(0, 0, 0, 0.7);
  width: 90%;
  max-width: 600px;
  margin: 20px auto;
  padding: 16px;
  border-radius: 10px;
}

h1 {
  text-align: center;
  font-size: 28px;
  margin-bottom: 20px;
}

.stage-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin-bottom: 24px;
}

.stage-card {
  background: #222;
  border: 1px solid #555;
  border-radius: 8px;
  padding: 10px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.1s, background 0.1s;
}

.stage-card:hover {
  background: #333;
  transform: scale(1.03);
}

.boss-face {
  width: 100%;
  max-width: 120px;
  height: auto;
  margin-bottom: 8px;
}

.boss-name {
  font-size: 15px;
  font-weight: bold;
}

/* 하단 버튼 */
.menu-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.menu-buttons button {
  padding: 10px 16px;
  font-size: 14px;
  border-radius: 6px;
  border: none;
  color: white;
}

#shopBtn {
  background: #600;
}

#statusBtn {
  background: #064;
}
</style>
</head>

<body>

<div id="stageSelect">
  <h1>STAGE SELECT</h1>

  <div class="stage-grid">
    <div class="stage-card" onclick="notReady()">
      <img src="images/Chill_penguin_mugshot.png" class="boss-face">
      <div class="boss-name">칠 펭귄</div>
    </div>

    <div class="stage-card" onclick="notReady()">
      <img src="images/Ground_scaravich_mugshot.png" class="boss-face">
      <div class="boss-name">그라운드 스카라비치</div>
    </div>

    <div class="stage-card" onclick="notReady()">
      <img src="images/Metal_man_mugshot.png" class="boss-face">
      <div class="boss-name">메탈맨</div>
    </div>

    <div class="stage-card" onclick="notReady()">
      <img src="images/Toxic_seahorse_mugshot.png" class="boss-face">
      <div class="boss-name">톡식 시호스</div>
    </div>

    <div class="stage-card" onclick="notReady()">
      <img src="images/Launch_octopus_mugshot.png" class="boss-face">
      <div class="boss-name">런처 옥토퍼스</div>
    </div>
  </div>

  <div class="menu-buttons">
    <button id="shopBtn" onclick="goShop()">상점</button>
    <button id="statusBtn" onclick="goStatus()">스탯</button>
  </div>
</div>

<script src="data.js"></script>
<script>
function notReady() {
  alert("아직 준비 중입니다.");
}

function goShop() {
  location.href = "shop.html";
}

function goStatus() {
  location.href = "stats.html";
}
</script>

</body>
</html>
