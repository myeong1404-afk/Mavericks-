<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Mavericks - Stage Select</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: "Malgun Gothic", sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

#stageSelect {
  width: 90%;
  max-width: 600px;
  text-align: center;
}

h1 {
  font-size: 28px;
  margin-bottom: 30px;
}

.stage-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin-bottom: 25px;
}

button {
  padding: 14px;
  font-size: 16px;
  background: #222;
  color: white;
  border: 1px solid #555;
  border-radius: 6px;
}

button:hover {
  background: #444;
}

/* 하단 버튼 */
.menu-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
}

#shopBtn {
  background: #600;
  border-color: #a00;
}

#statusBtn {
  background: #064;
  border-color: #0a6;
}
</style>
</head>

<body>

<div id="stageSelect">
  <h1>STAGE SELECT</h1>

  <div class="stage-grid">
    <button onclick="notReady()">칠 펭귄</button>
    <button onclick="notReady()">그라운드 스카라비치</button>
    <button onclick="notReady()">메탈맨</button>
    <button onclick="notReady()">톡식 시호스</button>
    <button onclick="notReady()">런처 옥토퍼스</button>
  </div>

  <!-- ✅ 하단 메뉴 버튼 -->
  <div class="menu-buttons">
    <button id="shopBtn" onclick="goShop()">상점</button>
    <button id="statusBtn" onclick="goStatus()">스탯</button>
  </div>
</div>
<script>
/* ===== 공통 플레이어 데이터 ===== */
const defaultPlayerData = {
  level: 1,
  money: 2000,
  stats: {
    hp: 100,
    attack: 10,
    defense: 0,
    agility: 5,
    magic: 8,
    mp: 50
  },
  equipment: {
    helmet: null,
    gloves: null,
    armor: null,
    boots: null
  },
  inventory: {
    "소형 에너지 탱크": 3,
    "중형 에너지 탱크": 0,
    "대형 에너지 탱크": 0,
    "MP 탱크": 0,
    "스페셜 탱크": 0,
    "큐어 탱크": 0
  }
};

function loadPlayerData() {
  let data = localStorage.getItem("playerData");
  if (!data) {
    localStorage.setItem("playerData", JSON.stringify(defaultPlayerData));
    return JSON.parse(JSON.stringify(defaultPlayerData));
  }
  return JSON.parse(data);
}

function savePlayerData(data) {
  localStorage.setItem("playerData", JSON.stringify(data));
}
const defaultPlayerData = {
  level: 1,
  money: 2000,
  stats: { maxHP:100, attack:10, defense:0, agility:5, magic:8, maxMP:50 },
  equipment: { helmet:null, gloves:null, armor:null, boots:null },
  inventory: {
    "소형 에너지 탱크":3, "중형 에너지 탱크":0, "대형 에너지 탱크":0,
    "MP 탱크":0, "스페셜 탱크":0, "큐어 탱크":0, "에너지 캡슐":0
  },
  clearedStages:[]
};

if (!localStorage.getItem("playerData")) {
  localStorage.setItem("playerData", JSON.stringify(defaultPlayerData));
}

let playerData = JSON.parse(localStorage.getItem("playerData"));

function savePlayerData() {
  localStorage.setItem("playerData", JSON.stringify(playerData));
}

function notReady() {
  alert("아직 준비 중입니다.");
}

function goShop() {
  location.href = "shop.html";
}

function goStatus() {
  location.href = "stats.html";
}
</script>
  

</body>
</html>
