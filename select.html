<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Mavericks - Stage Select</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body {
  margin: 0;
  background: url("images/Stage_select_1.jpg") no-repeat center center fixed;
  background-size: cover;
  color: white;
  font-family: "Malgun Gothic", sans-serif;
  min-height: 100vh;
}

#stageSelect {
  background: rgba(0, 0, 0, 0.7);
  width: 90%;
  max-width: 600px;
  margin: 20px auto;
  padding: 16px;
  border-radius: 10px;
}

h1 {
  text-align: center;
  font-size: 28px;
  margin-bottom: 20px;
}

.stage-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin-bottom: 24px;
}

.stage-card {
  background: #222;
  border: 1px solid #555;
  border-radius: 8px;
  padding: 10px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.1s, background 0.1s;
}

.stage-card:hover {
  background: #333;
  transform: scale(1.03);
}

.boss-face {
  width: 100%;
  max-width: 120px;
  height: auto;
  margin-bottom: 8px;
}

.boss-name {
  font-size: 15px;
  font-weight: bold;
}

.menu-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.menu-buttons button {
  padding: 10px 16px;
  font-size: 14px;
  border-radius: 6px;
  border: none;
  color: white;
}

#shopBtn { background: #600; }
#statusBtn { background: #064; }
</style>
</head>

<body>

<div id="stageSelect">
  <h1>STAGE SELECT</h1>

  <div class="stage-grid">
    <div class="stage-card" onclick="selectStage('chill')">
      <img src="images/Mugshots/Chill_penguin_mugshot.png" class="boss-face">
      <div class="boss-name">칠 펭귄</div>
    </div>

    <div class="stage-card" onclick="selectStage('scaravich')">
      <img src="images/Mugshots/Ground_scaravich_mugshot.png" class="boss-face">
      <div class="boss-name">그라운드 스카라비치</div>
    </div>

    <div class="stage-card" onclick="selectStage('metal')">
      <img src="images/Mugshots/Metal_man_mugshot.png" class="boss-face">
      <div class="boss-name">메탈맨</div>
    </div>

    <div class="stage-card" onclick="selectStage('toxic')">
      <img src="images/Mugshots/Toxic_seahorse_mugshot.png" class="boss-face">
      <div class="boss-name">톡식 시호스</div>
    </div>

    <div class="stage-card" onclick="selectStage('octopus')">
      <img src="images/Mugshots/Launch_octopus_mugshot.png" class="boss-face">
      <div class="boss-name">런처 옥토퍼스</div>
    </div>
  </div>

  <div class="menu-buttons">
    <button id="shopBtn" onclick="goShop()">상점</button>
    <button id="statusBtn" onclick="goStatus()">스탯</button>
  </div>
</div>

<script>
/* ===== 플레이어 데이터 (임시) ===== */
const playerLevel = 1;

/* ===== 스테이지 데이터 ===== */
const stages = {
  chill: {
    name: "칠 펭귄",
    mission: "남극의 인공 눈사태의 원인을 밝혀라",
    level: 1
  },
  scaravich: {
    name: "그라운드 스카라비치",
    mission: "이집트 유물 박물관의 유물 절도꾼을 사수하라",
    level: 2
  },
  metal: {
    name: "메탈맨",
    mission: "독일의 컨베이어 공장의 매버릭들의 음모를 저지하라",
    level: 3
  },
  toxic: {
    name: "톡식 시호스",
    mission: "인도의 대형 댐의 독극물 테러를 막아라",
    level: 4
  },
  octopus: {
    name: "런처 옥토퍼스",
    mission: "미 해군기지를 장악한 매버릭들을 파괴하라",
    level: 5
  }
};

/* ===== 스테이지 선택 ===== */
function selectStage(key) {
  const stage = stages[key];

  const info =
`[${stage.name}]
미션: ${stage.mission}
권장 레벨: ${stage.level}`;

  alert(info);

  if (playerLevel < stage.level) {
    const diff = stage.level - playerLevel;
    const warning = confirm(
`⚠ 주의
플레이어 레벨이 권장 레벨보다 ${diff}만큼 낮습니다.
그래도 입장하시겠습니까?`
    );
    if (!warning) return;
  }

  const enter = confirm("입장하시겠습니까?");
  if (!enter) return;

  // ⭐ 선택한 보스 저장
  localStorage.setItem("selectedStage", key);

  // ⭐ 스테이지 시작 연출로 이동
  location.href = "stagestart.html";
}

/* ===== 메뉴 ===== */
function goShop() {
  location.href = "shop.html";
}

function goStatus() {
  location.href = "stats.html";
}
</script>

</body>
</html>
