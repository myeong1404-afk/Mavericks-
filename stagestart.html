<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Stage Start</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: "Malgun Gothic", sans-serif;
}

#scene {
  position: relative;
  width: 100vw;
  height: 100dvh;
  background: black;
  overflow: hidden;
}

/* 우주 배경 */
#bg {
  position: absolute;
  inset: 0;
  background: url("images/Stagestart/Stagestart_bg.png") no-repeat center center;
  background-size: cover;
  opacity: 0;
  z-index: 1;
}

/* 매버릭 로고 */
#logo {
  position: absolute;
  top: 50%;
  left: 50%;
  height: 45vh;
  max-width: 100vw;
  transform: translate(-50%, -50%);
  opacity: 0;
  z-index: 2;
}

/* 보스 스프라이트 */
#bossSprite {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity 2s linear;
  z-index: 3;
}

/* 보스 이름 */
#bossName {
  position: absolute;
  bottom: 18%;
  width: 100%;
  text-align: center;
  font-size: 26px;
  letter-spacing: 4px;
  color: #7feaff;
  opacity: 0;
  z-index: 4;
}

/* 플래시 */
#flash {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 999;
}
</style>
</head>

<body>
  <audio id="bgm" src="audio/Stagestart.mp3" preload="auto"></audio>

<div id="scene">
  <div id="bg"></div>
  <img id="logo" src="images/Stagestart/Stagestart_mavericklogo.png">
  <img id="bossSprite">
  <div id="bossName"></div>
  <div id="flash"></div>
</div>

<script>
/* ===== 보스 데이터 ===== */
const bossData = {
  scaravich: {
    name: "GROUND SCARAVICH",
    sprite: "images/sprites/Groundscaravich/Scaravichdefault.png",
    size: 22
  },
  chill: {
    name: "CHILL PENGUIN",
    sprite: "images/sprites/Chillpenguin/penguindefault.png",
    size: 26
  },
  metal: {
    name: "METAL MAN",
    sprite: "images/sprites/Metalman/Metaldefault.png",
    size: 30
  },
  octopus: {
    name: "LAUNCH OCTOPUS",
    sprite: "images/sprites/Launchoctopus/Octopusdefault.png",
    size: 32
  },
  toxic: {
    name: "TOXIC SEAHORSE",
    sprite: "images/sprites/Toxicseahorse/Seahorsedefault.png",
    size: 28
  }
};

const selected = localStorage.getItem("selectedStage");
const boss = bossData[selected];

const bg = document.getElementById("bg");
const logo = document.getElementById("logo");
const flash = document.getElementById("flash");
const bossSprite = document.getElementById("bossSprite");
const bossName = document.getElementById("bossName");

/* 보스 설정 */
bossSprite.src = boss.sprite;
bossSprite.style.height = boss.size + "vh";
bossName.textContent = boss.name;

/* 플래시 */
function flashOnce(callback) {
  flash.style.opacity = 1;
  setTimeout(() => {
    flash.style.opacity = 0;
    if (callback) callback();
  }, 120);
}

/* ===== 연출 타임라인 ===== */

/* 2초 후 → 우주 배경 */
setTimeout(() => {
  flashOnce(() => {
    bg.style.opacity = 1;
  });
}, 2000);

/* 3초 → 로고 */
setTimeout(() => {
  flashOnce(() => {
    logo.style.opacity = 1;
  });
}, 3000);

/* 3초 → 보스 페이드인 */
setTimeout(() => {
  bossSprite.style.opacity = 1;
}, 3000);

/* 5.5초 → 배경 제거 + 이름 */
setTimeout(() => {
  flashOnce(() => {
    bg.style.opacity = 0;
    bossName.style.opacity = 1;
  });
}, 5500);

/* 6.5초 → 스테이지 선택으로 */
setTimeout(() => {
  location.href = "select.html";
}, 6500);
  const bgm = document.getElementById("bgm");

/* ===== 음악 재생 시도 ===== */
function playBGM() {
  bgm.volume = 0.6;
  bgm.play().catch(() => {
    console.log("자동 재생 차단됨 - 사용자 입력 대기");
  });
}

/* 연출 시작과 동시에 음악 시도 */
playBGM();

/* 혹시 자동재생이 막혔을 경우 대비 (첫 터치 시 재생) */
document.addEventListener("touchstart", () => {
  if (bgm.paused) playBGM();
}, { once: true });

document.addEventListener("click", () => {
  if (bgm.paused) playBGM();
}, { once: true });
</script>

</body>
</html>
