
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Stage Start</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: "Malgun Gothic", sans-serif;
}

#scene {
  position: relative;
  width: 100vw;
  height: 100dvh;
  background: black;
  overflow: hidden;
}

/* 우주 배경 */
#bg {
  position: absolute;
  inset: 0;
  background: url("images/Stagestart/Stagestart_bg.png") no-repeat center center;
  background-size: cover;
  opacity: 0;
}

/* 매버릭 로고 */
#logo {
  position: absolute;
  top: 50%;
  left: 50%;
  height: 45vh;
  width: auto;
  transform: translate(-50%, -50%);
  opacity: 0;
}

/* 보스 */
#bossSprite {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity 2s linear;
}

/* 플래시 */
#flash {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
}

/* 보스 이름 */
#bossName {
  position: absolute;
  bottom: 18%;
  width: 100%;
  text-align: center;
  font-size: 26px;
  letter-spacing: 4px;
  color: #7feaff;
  opacity: 0;
}
#ready {
  margin-top: 6px;
  font-size: 14px;
  opacity: 0.8;
}

#okBtn {
  margin-top: 16px;
  padding: 10px 20px;
  font-size: 14px;
  background: #c00;
  border: none;
  color: white;
  border-radius: 6px;
}
</style>
</head>

<body>

<div id="scene">
  <img id="logo" src="images/Stagestart/Stagestart_mavericklogo.png">
  <div id="flash" class="flash"></div>

  <div id="bossBox">
    <img id="bossSprite">
    <div id="bossName"></div>
    <div id="ready">준비중입니다</div>
    <button id="okBtn">확인</button>
  </div>
</div>

<script>
/* ===== 보스 데이터 ===== */
const bossData = {
  scaravich: {
    name: "GROUND SCARAVICH",
    sprite: "images/sprites/Groundscaravich/Scaravichdefault.png",
    size: 22
  },
  chill: {
    name: "CHILL PENGUIN",
    sprite: "images/sprites/Chillpenguin/penguindefault.png",
    size: 28
  },
  metal: {
    name: "METAL MAN",
    sprite: "images/sprites/Metalman/Metaldefault.png",
    size: 30
  },
  octopus: {
    name: "LAUNCH OCTOPUS",
    sprite: "images/sprites/Launchoctopus/Octopusdefault.png",
    size: 32
  },
  toxic: {
    name: "TOXIC SEAHORSE",
    sprite: "images/sprites/Toxicseahorse/Seahorsedefault.png",
    size: 34
  }
};

const bg = document.getElementById("bg");
const logo = document.getElementById("logo");
const flash = document.getElementById("flash");
const bossSprite = document.getElementById("bossSprite");
const bossName = document.getElementById("bossName");

const selected = localStorage.getItem("selectedStage");
const boss = bossData[selected];

bossSprite.src = boss.sprite;
bossSprite.style.height = boss.size + "vh";
bossName.textContent = boss.name;

function flashOnce(callback) {
  flash.style.opacity = 1;
  setTimeout(() => {
    flash.style.opacity = 0;
    if (callback) callback();
  }, 120);
}

/* 시작 */
setTimeout(() => {
  flashOnce(() => bg.style.opacity = 1);
}, 2000);

setTimeout(() => {
  flashOnce(() => logo.style.opacity = 1);
}, 3000);

setTimeout(() => {
  bossSprite.style.opacity = 1;
}, 3000);

setTimeout(() => {
  flashOnce(() => {
    bg.style.opacity = 0;
    bossName.style.opacity = 1;
  });
}, 5500);

setTimeout(() => {
  location.href = "select.html";
}, 6500);
</script>

</body>
</html>
