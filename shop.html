<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Mavericks - Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: "Malgun Gothic", sans-serif;
}

.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 12px;
}

h1 {
  text-align: center;
}

.money {
  text-align: center;
  color: #ffcc00;
  margin-bottom: 16px;
}

.section {
  margin-top: 20px;
}

.section h2 {
  border-bottom: 1px solid #444;
  padding-bottom: 4px;
  font-size: 18px;
}

.item {
  background: #222;
  padding: 10px;
  border-radius: 6px;
  margin-top: 10px;
}

.item-name {
  font-weight: bold;
}

.item-desc {
  font-size: 14px;
  opacity: 0.8;
}

.item-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 6px;
}

.price {
  color: #ffcc00;
}

button {
  background: #c00;
  border: none;
  color: white;
  padding: 6px 12px;
  border-radius: 4px;
}
</style>
</head>

<body>
<div class="container">
  <h1>Shop</h1>
  <div class="money" id="money"></div>

  <div class="section" id="shopList"></div>
</div>

<script>
/* === 플레이어 데이터 === */
const defaultPlayerData = {
  name: "엑스",
  job: "매버릭 헌터",
  level: 1,
  money: 2000,
  stats: {
    hp: 100,
    attack: 10,
    defense: 0,
    agility: 5,
    magic: 8,
    mp: 50
  },
  equipment: {
    helmet: null,
    gloves: null,
    armor: null,
    boots: null
  },
  inventory: {
    "소형 에너지 탱크": 3,
    "중형 에너지 탱크": 0,
    "대형 에너지 탱크": 0,
    "MP 탱크": 0,
    "스페셜 탱크": 0,
    "큐어 탱크": 0
  }
};

if (!localStorage.getItem("playerData")) {
  localStorage.setItem("playerData", JSON.stringify(defaultPlayerData));
}

let playerData = JSON.parse(localStorage.getItem("playerData"));

/* === 상점 데이터 === */
const shopItems = [
  {section:"소모 아이템", name:"소형 에너지 탱크", desc:"HP 50 회복", price:150, type:"item"},
  {section:"소모 아이템", name:"중형 에너지 탱크", desc:"HP 150 회복", price:350, type:"item"},
  {section:"소모 아이템", name:"대형 에너지 탱크", desc:"HP 100% 회복", price:800, type:"item"},
  {section:"소모 아이템", name:"MP 탱크", desc:"MP 100% 회복", price:600, type:"item"},
  {section:"소모 아이템", name:"스페셜 탱크", desc:"HP / MP 100% 회복", price:1200, type:"item"},
  {section:"소모 아이템", name:"큐어 탱크", desc:"상태이상 치료", price:300, type:"item"},

  {section:"헬멧 (마법력)", name:"C급 헬멧", desc:"마법력 +2", price:300, type:"helmet"},
  {section:"헬멧 (마법력)", name:"B급 헬멧", desc:"마법력 +4", price:700, type:"helmet"},
  {section:"헬멧 (마법력)", name:"A급 헬멧", desc:"마법력 +7", price:1400, type:"helmet"},
  {section:"헬멧 (마법력)", name:"S급 헬멧", desc:"마법력 +11", price:2500, type:"helmet"}
];

const shopList = document.getElementById("shopList");
const moneyEl = document.getElementById("money");

function updateMoney() {
  moneyEl.textContent = `소지금: ${playerData.money} G`;
}

function renderShop() {
  shopList.innerHTML = "";
  let currentSection = "";

  shopItems.forEach(item => {
    if (item.section !== currentSection) {
      currentSection = item.section;
      const h2 = document.createElement("h2");
      h2.textContent = currentSection;
      shopList.appendChild(h2);
    }

    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <div class="item-name">${item.name}</div>
      <div class="item-desc">${item.desc}</div>
      <div class="item-bottom">
        <span class="price">${item.price} G</span>
        <button>구매</button>
      </div>
    `;

    div.querySelector("button").onclick = () => {
      if (playerData.money < item.price) {
        alert("돈이 부족합니다");
        return;
      }

      playerData.money -= item.price;

      if (item.type === "item") {
        playerData.inventory[item.name]++;
      } else {
        playerData.equipment[item.type] = item.name;
      }

      localStorage.setItem("playerData", JSON.stringify(playerData));
      updateMoney();
      alert("구매 완료!");
    };

    shopList.appendChild(div);
  });
}

updateMoney();
renderShop();
</script>
</body>
</html>
