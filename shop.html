<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Mavericks - Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: "Malgun Gothic", sans-serif;
}
.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 12px;
}
h1 {
  text-align: center;
}
.money {
  text-align: center;
  color: #ffcc00;
  margin-bottom: 16px;
}
h2 {
  border-bottom: 1px solid #444;
  padding-bottom: 4px;
  font-size: 18px;
  margin-top: 20px;
}
.item {
  background: #222;
  padding: 10px;
  border-radius: 6px;
  margin-top: 10px;
}
.item-name {
  font-weight: bold;
}
.item-desc {
  font-size: 14px;
  opacity: 0.8;
}
.item-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.price {
  color: #ffcc00;
}
button {
  background: #c00;
  border: none;
  color: white;
  padding: 6px 12px;
  border-radius: 4px;
}
</style>
</head>

<body>
<div class="container">
  <h1>Shop</h1>
  <div class="money" id="money"></div>
  <div id="shopList"></div>
</div>
<script src="data.js"></script>
<script>
  const playerData = loadPlayerData();
  
  
  const shopItems = [
    {section:"소모 아이템", name:"소형 에너지 탱크", desc:"HP 50 회복", price:150, type:"item"},
    {section:"소모 아이템", name:"중형 에너지 탱크", desc:"HP 150 회복", price:350, type:"item"},
    {section:"소모 아이템", name:"대형 에너지 탱크", desc:"HP 100% 회복", price:800, type:"item"},
    {section:"소모 아이템", name:"스페셜 탱크", desc:"HP/MP 100% 회복", price:1200, type:"item"},
    {section:"소모 아이템", name:"큐어 탱크", desc:"상태이상 치료", price:600, type:"item"},
    {section:"헬멧 (마법력)", name:"C급 헬멧", desc:"마법력 +2", price:300, type:"helmet"},
    {section:"헬멧 (마법력)", name:"B급 헬멧", desc:"마법력 +4", price:700, type:"helmet"},
    {section:"헬멧 (마법력)", name:"A급 헬멧", desc:"마법력 +7", price:1400, type:"helmet"},
    {section:"헬멧 (마법력)", name:"S급 헬멧", desc:"마법력 +11", price:2500, type:"helmet"},
    {section:"장갑 (공격력)", name:"C급 장갑", desc:"공격력 +2", price:300, type:"gloves"},
    {section:"장갑 (공격력)", name:"B급 장갑", desc:"공격력 +4", price:700, type:"gloves"},
    {section:"장갑 (공격력)", name:"A급 장갑", desc:"공격력 +6", price:1400, type:"gloves"},
    {section:"장갑 (공격력)", name:"S급 장갑", desc:"공격력 +9", price:2500, type:"gloves"},
    {section:"갑옷 (방어력)", name:"C급 갑옷", desc:"방어력 +1", price:400, type:"armor"},
    {section:"갑옷 (방어력)", name:"B급 갑옷", desc:"방어력 +2", price:900, type:"armor"},
    {section:"갑옷 (방어력)", name:"A급 갑옷", desc:"방어력 +3", price:1700, type:"armor"},
    {section:"갑옷 (방어력)", name:"S급 갑옷", desc:"방어력 +5", price:3000, type:"armor"},
    {section:"부츠 (민첩성)", name:"C급 부츠", desc:"민첩성 +2", price:300, type:"boots"}
    {section:"부츠 (민첩성)", name:"B급 부츠", desc:"민첩성 +4", price:700, type:"boots"}
    {section:"부츠 (민첩성)", name:"A급 부츠", desc:"민첩성 +6", price:1400, type:"boots"}   
    {section:"부츠 (민첩성)", name:"S급 부츠", desc:"민첩성 +9", price:2500, type:"boots"}
  ];

  const shopList = document.getElementById("shopList");
  const moneyEl = document.getElementById("money");

  function updateMoney() {
    moneyEl.textContent = `소지금: ${playerData.money} G`;
  }

  function renderShop() {
    let current = "";
    shopList.innerHTML = "";

    shopItems.forEach(item => {
      if (item.section !== current) {
        current = item.section;
        const h2 = document.createElement("h2");
        h2.textContent = current;
        shopList.appendChild(h2);
      }

      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <div class="item-name">${item.name}</div>
        <div class="item-desc">${item.desc}</div>
        <div class="item-bottom">
          <span class="price">${item.price} G</span>
          <button>구매</button>
        </div>
      `;

      div.querySelector("button").onclick = () => {
  const qty = prompt("몇 개 살까?");
  if (qty === null) return;

  const count = parseInt(qty);
  if (isNaN(count) || count <= 0) return alret("구매 취소됨");

  const total = item.price * count;
  if (playerData.money < total) return alert("돈이 부족해");

  playerData.money -= total;

  // 🔹 소모 아이템이면 인벤토리에 추가
  if (item.type === "item") {
    if (!playerData.inventory[item.name]) {
      playerData.inventory[item.name] = 0;
    }
    playerData.inventory[item.name] += count;
  }

  savePlayerData(playerData);
  updateMoney();
  alert("구매 완료!");
};

      shopList.appendChild(div);
    });
  }

  updateMoney();
  renderShop();
</script>
  
</body>
</html>
