<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Battle - Chill Penguin</title>

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>
/* ===== 공통 ===== */
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: "Malgun Gothic", sans-serif;
}

/* ===== 가로 화면 강제 안내 ===== */
#rotateNotice {
  position: fixed;
  inset: 0;
  background: black;
  color: white;
  display: none;
  justify-content: center;
  align-items: center;
  text-align: center;
  z-index: 100;
  font-size: 20px;
}

/* ===== 전투 화면 ===== */
#battle {
  position: relative;
  width: 100vw;
  height: 100vh;
  background: url("../images/sprites/chillpenguin/penguinstage.jpg") no-repeat center center;
  background-size: cover;
}

/* 기준 라인 */
#floor {
  position: absolute;
  bottom: 28%;
  width: 100%;
}

#ceiling {
  position: absolute;
  bottom: calc(28% + 67%);
  width: 100%;
}

/* 레버 */
#lever {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(28% + 67%);
  width: 64px;
}

/* 스프라이트 */
.sprite {
  position: absolute;
  bottom: 28%;
}

#player {
  left: 10%;
  width: 96px;
}

#boss {
  right: 10%;
  width: 120px;
}

/* ===== READY ===== */
#ready {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: black;
  z-index: 10;
}

#ready img {
  width: 40%;
}

/* ===== UI ===== */
#ui {
  position: absolute;
  bottom: 0;
  width: 100%;
  background: rgba(0,0,0,0.8);
  padding: 8px;
  display: flex;
  justify-content: space-around;
}

button {
  padding: 10px;
  font-size: 16px;
  background: #222;
  color: white;
  border: 1px solid #555;
  border-radius: 6px;
}
</style>
</head>

<body>

<!-- 가로 화면 안내 -->
<div id="rotateNotice">
  📱 화면을 가로로 돌려주세요
</div>

<div id="battle">

  <div id="floor"></div>
  <div id="ceiling"></div>
  <img id="lever" src="../images/sprites/chillpenguin/Lever.png">

  <img id="player" class="sprite" src="../images/sprites/X/Xdefault.png">
  <img id="boss" class="sprite" src="../images/sprites/chillpenguin/penguindefault.png">

  <!-- READY -->
  <div id="ready">
    <img src="../images/Ready.png">
  </div>

  <div id="ui">
    <button onclick="attack()">공격</button>
    <button onclick="guard()">가드</button>
    <button onclick="openSkills()">스킬</button>
    <button onclick="openItems()">아이템</button>
  </div>
</div>

<audio id="readySfx" src="../audio/sfx/Ready.wav"></audio>

<script src="../data.js"></script>
<script src="../Savedata.js"></script>

<script>
/* ===== 가로화면 체크 ===== */
function checkOrientation() {
  const notice = document.getElementById("rotateNotice");
  if (window.innerWidth < window.innerHeight) {
    notice.style.display = "flex";
  } else {
    notice.style.display = "none";
  }
}

window.addEventListener("resize", checkOrientation);
window.addEventListener("orientationchange", checkOrientation);
checkOrientation();

/* ===== 데이터 로드 ===== */
const player = loadPlayerData();

const boss = {
  name: "칠 펭귄",
  maxHp: 180,
  hp: 180,
  attack: 20
};

/* ===== 계산 ===== */
function calcDamage(base, defense) {
  return Math.floor(base * (100 / (100 + defense * 5)));
}

function checkEvade(agi) {
  return Math.random() * 100 < Math.min(30, agi * 2);
}

/* ===== READY 연출 ===== */
const readyBox = document.getElementById("ready");
const readySfx = document.getElementById("readySfx");

readySfx.play().catch(()=>{});

setTimeout(() => {
  readyBox.style.display = "none";
  teleportIn();
}, 1500);

/* ===== 텔레포트 ===== */
function teleportIn() {
  document.getElementById("player").src =
    "../images/sprites/X/Xteleport1.png";
}

/* ===== 행동 ===== */
function attack() {
  boss.hp -= calcDamage(player.stats.attack, 0);
  enemyTurn();
}

function guard() {
  player.guard = true;
  enemyTurn();
}

/* ===== 적 턴 ===== */
function enemyTurn() {
  setTimeout(() => {
    if (checkEvade(player.stats.agility)) return;

    let def = player.stats.defense;
    if (player.guard) {
      def += 20 + player.level * 5;
      player.guard = false;
    }

    player.stats.hp -= calcDamage(18, def);
    if (player.stats.hp <= 0) alert("패배...");
  }, 600);
}
</script>

</body>
</html>
