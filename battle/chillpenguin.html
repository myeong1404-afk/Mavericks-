<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Battle - Chill Penguin</title>

<!-- viewport -->
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- 🔥 PWA / 풀스크린 -->
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* 🔥 추가: 전체 스크롤 차단 */
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none; /* 추가로 흔들림 방지 */
}

/* 기존 body 스타일 */
body {
  background: black;
  font-family: sans-serif;
}
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: sans-serif;
}

/* 가로 안내 */
#rotateNotice {
  position: fixed;
  inset: 0;
  background: black;
  color: white;
  display: none;
  justify-content: center;
  align-items: center;
  font-size: 20px;
  z-index: 999;
}

/* 전투 화면 */
#battle {
  position: relative;
  width: 100vw;
  height: 100vh; /* 🔥 dvh 제거 */
  background: url("../images/sprites/Chillpenguin/Penguinstage.jpg") no-repeat center;
  background-size: cover;
}

/* 바닥 */
.sprite {
  position: absolute;
  bottom: 28%;
}

#player {
  left: 10%;
  width: 96px;
}

#boss {
  right: 10%;
  width: 120px;
}

/* ===== HP UI ===== */
.hpBar {
  position: absolute;
  top: 10px;
  width: 20px;
  height: 180px;
  background: black;
  border: 2px solid white;
}

.hpFill {
  position: absolute;
  bottom: 0;
  width: 100%;
  background: yellow;
}

/* 플레이어 HP */
#playerHP {
  left: 10px;
}

/* 보스 HP */
#bossHP {
  right: 10px;
}

/* READY */
#ready {
  transition: opacity 0.3s;
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: black;
  z-index: 10;
}

#ready img {
  width: 40%;
}

/* UI 버튼 */
#ui {
  position: absolute;
  bottom: env(safe-area-inset-bottom);
  width: 100%;
  background: rgba(0,0,0,0.8);
  padding: 6px;
  display: flex;
  justify-content: space-around;
}

button {
  padding: 10px;
  font-size: 16px;
  background: #222;
  color: white;
  border: 1px solid #555;
  border-radius: 6px;
}
</style>
</head>

<body>

<div id="rotateNotice">📱 가로 화면으로 돌려주세요</div>

<div id="battle">

  <!-- HP UI -->
  <div id="playerHP" class="hpBar">
    <div id="playerHPFill" class="hpFill"></div>
  </div>

  <div id="bossHP" class="hpBar">
    <div id="bossHPFill" class="hpFill"></div>
  </div>

  <!-- 캐릭터 -->
  <img id="player" class="sprite" src="../images/sprites/X/Xdefault.png">
  <img id="boss" class="sprite" src="../images/sprites/Chillpenguin/penguindefault.png">

  <!-- READY -->
  <div id="ready">
    <img src="../images/Ready.png">
  </div>

  <!-- UI -->
  <div id="ui">
    <button onclick="attack()">공격</button>
    <button onclick="guard()">가드</button>
    <button onclick="openSkills()">스킬</button>
    <button onclick="openItems()">아이템</button>
  </div>

</div>

<audio id="readySfx" src="../audio/sfx/Ready.wav"></audio>

<script src="../data.js"></script>
<script src="../Savedata.js"></script>

<script>
  function fixHeight() {
  document.getElementById("battle").style.height =
    window.innerHeight + "px";
}

window.addEventListener("resize", fixHeight);
window.addEventListener("orientationchange", fixHeight);
fixHeight();
/* 가로 체크 */
function checkOrientation() {
  document.getElementById("rotateNotice").style.display =
    window.innerWidth < window.innerHeight ? "flex" : "none";
}
window.addEventListener("resize", checkOrientation);
window.addEventListener("orientationchange", checkOrientation);
checkOrientation();

/* 데이터 */
let player;

try {
  player = loadPlayerData();
} catch (e) {
  console.error(e);
}

if (!player || !player.stats) {
  // 🔥 임시 더미 플레이어 (세이브 없어도 실행되게)
  player = {
    level: 1,
    guard: false,
    baseStats: { hp: 100 },
    stats: {
      hp: 100,
      attack: 16,
      defense: 8,
      agility: 5
    }
  };
    }
const boss = { maxHp: 180, hp: 180 };

/* 데미지 공식 */
function calcDamage(base, def) {
  return Math.floor(base * (100 / (100 + def * 5)));
}

/* READY */
const readyBox = document.getElementById("ready");
document.getElementById("readySfx").play().catch(()=>{});

setTimeout(() => {
  readyBox.style.opacity = "0";
  setTimeout(() => {
    readyBox.style.display = "none";
  }, 300);
}, 1500);

/* HP 업데이트 */
function updateHP() {
  document.getElementById("playerHPFill").style.height =
    (player.stats.hp / player.baseStats.hp * 100) + "%";

  document.getElementById("bossHPFill").style.height =
    (boss.hp / boss.maxHp * 100) + "%";
}
updateHP();

/* 행동 */
function attack() {
  boss.hp -= calcDamage(player.stats.attack, 0);
  if (boss.hp < 0) boss.hp = 0;
  updateHP();
  enemyTurn();
}

function guard() {
  player.guard = true;
  enemyTurn();
}

/* 적 턴 */
function enemyTurn() {
  setTimeout(() => {
    let def = player.stats.defense;
    if (player.guard) {
      def += 20 + player.level * 5;
      player.guard = false;
    }

    player.stats.hp -= calcDamage(18, def);
    if (player.stats.hp < 0) player.stats.hp = 0;
    updateHP();

    if (player.stats.hp <= 0) alert("패배...");
  }, 500);
}

/* 임시 함수 (안 넣으면 게임 멈춤) */
function openSkills() {
  alert("스킬 시스템 구현 예정");
}

function openItems() {
  alert("아이템 시스템 구현 예정");
}
</script>

</body>
</html>
