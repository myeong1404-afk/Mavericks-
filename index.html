<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Mavericks</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: "Malgun Gothic", sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.screen {
  display: none;
  width: 90%;
  max-width: 600px;
  text-align: center;
}

.active {
  display: block;
}

h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

h2 {
  font-size: 18px;
  opacity: 0.8;
  margin-bottom: 40px;
}

button {
  padding: 12px 24px;
  font-size: 18px;
  background: #c00;
  color: white;
  border: none;
  border-radius: 6px;
}

#introText {
  text-align: left;
  line-height: 1.8;
  min-height: 220px;
  white-space: pre-line;
}

#hint {
  margin-top: 20px;
  font-size: 12px;
  opacity: 0.6;
}
</style>
</head>

<body>

<!-- 🔴 타이틀 -->
<div id="titleScreen" class="screen active">
  <h1>MAVERICKS</h1>
  <h2>X and Zero's Legacy</h2>
  <button id="startBtn">START</button>
</div>
  <button id="resetBtn">DATA RESET</button>
document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("모든 진행 상황을 초기화할까요?")) {
    localStorage.removeItem("playerData");
    location.reload();
  }
});
<!-- 🔵 인트로 -->
<div id="introScreen" class="screen">
  <div id="introText"></div>
  <div id="hint">화면을 터치하면 계속</div>
</div>

<script>
/* ===== 공통 플레이어 데이터 ===== */
const defaultPlayerData = {
  level: 1,
  money: 2000,
  stats: {
    hp: 100,
    attack: 10,
    defense: 0,
    agility: 5,
    magic: 8,
    mp: 50
  },
  equipment: {
    helmet: null,
    gloves: null,
    armor: null,
    boots: null
  },
  inventory: {
    "소형 에너지 탱크": 3,
    "중형 에너지 탱크": 0,
    "대형 에너지 탱크": 0,
    "MP 탱크": 0,
    "스페셜 탱크": 0,
    "큐어 탱크": 0
  }
};

function loadPlayerData() {
  let data = localStorage.getItem("playerData");
  if (!data) {
    localStorage.setItem("playerData", JSON.stringify(defaultPlayerData));
    return JSON.parse(JSON.stringify(defaultPlayerData));
  }
  return JSON.parse(data);
}

function savePlayerData(data) {
  localStorage.setItem("playerData", JSON.stringify(data));
}
const titleScreen = document.getElementById("titleScreen");
const introScreen = document.getElementById("introScreen");
const textEl = document.getElementById("introText");
const startBtn = document.getElementById("startBtn");

/* ===== 인트로 스토리 ===== */
const story = [
  "매버릭 전쟁이 끝나고 30년 후...\n엑스와 제로의 활약으로 모든 매버릭들의 대장 시그마는 파괴되었다.",
  "제로는 시그마와 싸울때마다 자신의 에너지가 커지는 것을 느꼈다.\n전쟁이 끝나고도 제로의 에너지에 대한 시그마의 욕구는 꺼지지 않았다.",
  "엑스는 늘 세계를 구하기 위해\n자신의 친구 제로를 파괴해야 할까봐 두려웠다.",
  "어느 날, 제로는 처분된 매버릭들의 부품이 재활용되는\n\"매버릭 쓰레기장\"을 조사하는 임무를 맡았다.",
  "그러나 제로가 그곳에서 실종되는 사고가 일어난다.",
  "제로의 보디는 모든 과학자들에게 수수께끼다.\n누가 제로를 만들었는가?\n왜 제로의 에너지는 갈수록 치솟는가?",
  "엑스와 에이리아는\n제로를 찾기 위한 모험을 떠나게 되는데..."
];

/* ===== 엑스 & 에이리아 대화 ===== */
const dialogue = [
  "엑스: 그래서… 제로는 어디에 있는 거지?",
  "에이리아: 아직 정확한 위치는 파악되지 않았어.\n하지만 누군가 의도적으로 제로의 신호를 교란하고 있어.",
  "에이리아: 확실한 건, 제로가 납치되었다는 거야.\n마지막 반응은… 매버릭 쓰레기장 인근이었어.",
  "(경보음이 울린다)",
  "에이리아: 엑스! 전국에서 강력한 매버릭 신호 다섯 개가 동시에 감지됐어!",
  "엑스: 다섯 개나…?",
  "에이리아: 신호 중 네 개는 30년 전 파괴된 매버릭이야.",
  "에이리아: 나머지 하나는… 매우 오래된 데이터야.",
  "엑스: 구형 로봇까지…?\n대체 누가 이런 짓을…",
  "에이리아: 남극의 칠 펭귄.\n이집트의 그라운드 스카라비치.",
  "에이리아: 독일의 정체불명의 구식 로봇.\n인도의 톡식 시호스.\n미국의 런처 옥토퍼스.",
  "엑스: 시그마는 사라졌을 텐데…\n그럼 배후가 따로 있다는 건가?",
  "에이리아: 지금은 세계를 안정시키는 게 우선이야.",
  "에이리아: 엑스, 다섯 매버릭을 저지해 줘.",
  "엑스: 알겠어.\n지금 당장 출동한다!"
];

let mode = "story"; // story → dialogue
let line = 0;
let char = 0;
let typing = false;
let typingTimer = null;
const speed = 35;

/* ===== 타이틀 → 인트로 ===== */
startBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  titleScreen.classList.remove("active");
  introScreen.classList.add("active");

  mode = "story";
  line = 0;
  resetTyping();
  typeText();
});

/* ===== 타이핑 효과 ===== */
function typeText() {
  typing = true;
  const source = mode === "story" ? story : dialogue;

  if (char < source[line].length) {
    textEl.textContent += source[line][char];
    char++;
    typingTimer = setTimeout(typeText, speed);
  } else {
    typing = false;
    typingTimer = null;
  }
}

/* ===== 다음 문장 ===== */
function nextLine() {
  if (typing) {
    clearTimeout(typingTimer);
    textEl.textContent = (mode === "story" ? story : dialogue)[line];
    typing = false;
    return;
  }

  line++;

  const source = mode === "story" ? story : dialogue;

  if (line < source.length) {
    resetTyping();
    typeText();
  } else {
    if (mode === "story") {
      // 🔁 스토리 끝 → 대화 시작
      mode = "dialogue";
      line = 0;
      resetTyping();
      typeText();
    } else {
      // ✅ 대화 끝 → 스테이지 선택
      window.location.href = "select.html";
    }
  }
}

/* ===== 초기화 ===== */
function resetTyping() {
  clearTimeout(typingTimer);
  typingTimer = null;
  char = 0;
  typing = false;
  textEl.textContent = "";
}

introScreen.addEventListener("click", nextLine);
introScreen.addEventListener("touchstart", nextLine);
</script>


</body>
</html>
