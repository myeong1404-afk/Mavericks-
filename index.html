<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Mavericks</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: "Malgun Gothic", sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.screen {
  display: none;
  width: 90%;
  max-width: 600px;
  text-align: center;
}

.active {
  display: block;
}

h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

h2 {
  font-size: 18px;
  opacity: 0.8;
  margin-bottom: 40px;
}

button {
  padding: 12px 24px;
  font-size: 18px;
  background: #c00;
  color: white;
  border: none;
  border-radius: 6px;
}

#introText {
  text-align: left;
  line-height: 1.8;
  min-height: 220px;
  white-space: pre-line;
}

#hint {
  margin-top: 20px;
  font-size: 12px;
  opacity: 0.6;
}
</style>
</head>

<body>

<!-- 🔴 타이틀 -->
<div id="titleScreen" class="screen active">
  <h1>MAVERICKS</h1>
  <h2>X and Zero's Legacy</h2>
  <button id="startBtn">START</button>
</div>

<!-- 🔵 인트로 -->
<div id="introScreen" class="screen">
  <div id="introText"></div>
  <div id="hint">화면을 터치하면 계속</div>
</div>

<script>
const titleScreen = document.getElementById("titleScreen");
const introScreen = document.getElementById("introScreen");
const textEl = document.getElementById("introText");
const startBtn = document.getElementById("startBtn");

const story = [
  "매버릭 전쟁이 끝나고 30년 후...\n엑스와 제로의 활약으로 모든 매버릭들의 대장 시그마는 파괴되었다.",
  "제로는 시그마와 싸울때마다 자신의 에너지가 커지는 것을 느꼈다.\n전쟁이 끝나고도 제로의 에너지에 대한 시그마의 욕구는 꺼지지 않았다.",
  "엑스는 늘 세계를 구하기 위해\n자신의 친구 제로를 파괴해야 할까봐 두려웠다.",
  "어느 날, 제로는 처분된 매버릭들의 부품이 재활용되는\n\"매버릭 쓰레기장\"을 조사하는 임무를 맡았다.",
  "그러나 제로가 그곳에서 실종되는 사고가 일어난다.",
  "제로의 보디는 모든 과학자들에게 수수께끼다.\n누가 제로를 만들었는가?\n왜 제로의 에너지는 갈수록 치솟는가?",
  "엑스와 에이리아는\n제로를 찾기 위한 모험을 떠나게 되는데..."
];

let line = 0;
let char = 0;
let typing = false;
let typingTimer = null; // 🔥 핵심
const speed = 35;

/* ===== 타이틀 → 인트로 ===== */
startBtn.addEventListener("click", (e) => {
  e.stopPropagation();

  titleScreen.classList.remove("active");
  introScreen.classList.add("active");

  resetTyping();
  typeText();
});

/* ===== 타이핑 효과 ===== */
function typeText() {
  typing = true;

  if (char < story[line].length) {
    textEl.textContent += story[line][char];
    char++;

    typingTimer = setTimeout(typeText, speed);
  } else {
    typing = false;
    typingTimer = null;
  }
}

/* ===== 다음 문장 ===== */
function nextLine() {
  if (typing) {
    // 🔥 연타 시: 타이머 완전 제거
    clearTimeout(typingTimer);
    typingTimer = null;

    textEl.textContent = story[line];
    typing = false;
    return;
  }

  line++;

  if (line < story.length) {
    resetTyping();
    typeText();
  } else {
    window.location.href = "select.html";
  }
}

/* ===== 타이핑 상태 초기화 ===== */
function resetTyping() {
  clearTimeout(typingTimer);
  typingTimer = null;
  char = 0;
  typing = false;
  textEl.textContent = "";
}

/* intro 화면에서만 입력 받기 */
introScreen.addEventListener("click", nextLine);
introScreen.addEventListener("touchstart", nextLine);
</script>


</body>
</html>
