  "에이리아: 나머지 하나는… 매우 오래된 데이터야.",
  "엑스: 구형 로봇까지…?\n대체 누가 이런 짓을…",
  "에이리아: 남극의 칠 펭귄.\n이집트의 그라운드 스카라비치.",

  "엑스: 시그마는 사라졌을 텐데…\n그럼 배후가 따로 있다는 건가?",
  "에이리아: 지금은 세계를 안정시키는 게 우선이야.",
  "에이리아: 엑스, 다섯 매버릭을 저지해 줘.",
  "엑스: 알겠어.\n지금 당장 출동한다!"
];

<!-- 🔴 타이틀 -->
<div id="titleScreen" class="screen active">

  <h2>X and Zero's Legacy</h2>
  <button id="startBtn">START</button>

</div>

<div id="introScreen" class="screen">
  <img id="mugshot" src="">
  <div id="introText"></div>
  <div id="hint">화면을 터치하면 계속</div>
  <button id="skipBtn">SKIP</button>
</div>

<script src="data.js"></script>

<script>
loadPlayerData();

/* ===== DOM ===== */
const titleScreen = document.getElementById("titleScreen");
const introScreen = document.getElementById("introScreen");
const textEl = document.getElementById("introText");
const mugshot = document.getElementById("mugshot");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");
const skipBtn = document.getElementById("skipBtn");

/* ===== 스토리 ===== */

  "매버릭 전쟁이 끝나고 30년 후...\n엑스와 제로의 활약으로 모든 매버릭들의 대장 시그마는 파괴되었다.",

  "엑스는 늘 세계를 구하기 위해\n자신의 친구 제로를 파괴해야 할까봐 두려웠다.",
  "어느 날, 제로는 처분된 매버릭들의 부품이 재활용되는\n\"매버릭 쓰레기장\"을 조사하는 임무를 맡았다.",
  "그러나 제로가 그곳에서 실종되는 사고가 일어난다.",
  "엑스와 에이리아는\n제로를 찾기 위한 모험을 떠나게 되는데..."
];

const dialogue = [
  "엑스: 그래서… 제로는 어디에 있는 거지?",
  "에이리아: 아직 정확한 위치는 파악되지 않았어.\n하지만 누군가 의도적으로 제로의 신호를 교란하고 있어.",
  "에이리아: 확실한 건, 제로가 납치되었다는 거야.\n마지막 반응은… 매버릭 쓰레기장 인근이었어.",
  "(경보음이 울린다)",
  "에이리아: 엑스! 전국에서 강력한 매버릭 신호 다섯 개가 동시에 감지됐어!",
  "엑스: 다섯 개나…?",
  "에이리아: 신호 중 네 개는 30년 전 파괴된 매버릭이야.",
  "에이리아: 나머지 하나는… 매우 오래된 데이터야.",
  "엑스: 구형 로봇까지…?\n대체 누가 이런 짓을…",
  "에이리아: 남극의 칠 펭귄.\n이집트의 그라운드 스카라비치.",
  "에이리아: 독일의 정체불명의 구식 로봇.\n인도의 톡식 시호스.\n미국의 런처 옥토퍼스.",
  "엑스: 시그마는 사라졌을 텐데…\n그럼 배후가 따로 있다는 건가?",
  "에이리아: 지금은 세계를 안정시키는 게 우선이야.",
  "에이리아: 엑스, 다섯 매버릭을 저지해 줘.",
  "엑스: 알겠어.\n지금 당장 출동한다!"
];

let mode = "story";
let line = 0;
let char = 0;
let typing = false;
let typingTimer = null;
const speed = 35;

/* ===== 타이틀 → 인트로 ===== */
startBtn.addEventListener("click", () => {
  titleScreen.classList.remove("active");
  introScreen.classList.add("active");
  resetTyping();
  updateMugshot();
  typeText();
});

/* ===== 머그샷 처리 ===== */
function updateMugshot() {
  mugshot.style.display = "none";

  if (mode !== "dialogue") return;

  const text = dialogue[line];
  if (text.startsWith("엑스:")) {
    mugshot.src = "images/X_mugshot.png";
    mugshot.style.display = "block";
  } else if (text.startsWith("에이리아:")) {
    mugshot.src = "images/Alia_mugshot.png";
    mugshot.style.display = "block";
  }
}

/* ===== 타이핑 ===== */
function typeText() {
  typing = true;
  const source = mode === "story" ? story : dialogue;

  if (char < source[line].length) {
    textEl.textContent += source[line][char++];
    typingTimer = setTimeout(typeText, speed);
  } else {
    typing = false;
  }
}

function nextLine() {
  if (typing) {
    clearTimeout(typingTimer);
    typing = false;
    return;
  }

  line++;
  const source = mode === "story" ? story : dialogue;

  if (line < source.length) {
    resetTyping();
    updateMugshot();
    typeText();
  } else if (mode === "story") {
    mode = "dialogue";
    line = 0;
    resetTyping();
    updateMugshot();
    typeText();
  } else {
    location.href = "select.html";
  }
}

function resetTyping() {
  clearTimeout(typingTimer);
  char = 0;
  typing = false;
  textEl.textContent = "";
}

introScreen.addEventListener("touchstart", nextLine);

/* ===== 스킵 ===== */
skipBtn.addEventListener("click", () => {
  location.href = "select.html";
});

/* ===== 데이터 리셋 ===== */
resetBtn.addEventListener("click", () => {
  if (confirm("모든 진행 상황을 초기화할까요?")) {
    localStorage.removeItem("playerData");
    location.reload();
  }
});
</script>
