<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Mavericks</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: "Malgun Gothic", sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.screen {
  display: none;
  width: 90%;
  max-width: 600px;
  text-align: center;
}

.active {
  display: block;
}

h1 { font-size: 36px; margin-bottom: 10px; }
h2 { font-size: 18px; opacity: 0.8; margin-bottom: 40px; }

button {
  padding: 12px 24px;
  font-size: 18px;
  background: #c00;
  color: white;
  border: none;
  border-radius: 6px;
}

#introText {
  text-align: left;
  line-height: 1.8;
  min-height: 160px;
  white-space: pre-line;
}

#mugshot {
  width: 120px;
  margin: 0 auto 10px;
  display: none;
}

#hint {
  margin-top: 10px;
  font-size: 12px;
  opacity: 0.6;
}

#skipBtn {
  margin-top: 15px;
  font-size: 14px;
  background: #444;
}
</style>
</head>

<body>

<!-- 타이틀 -->
<div id="titleScreen" class="screen active">
  <h1>MAVERICKS</h1>
  <h2>X and Zero's Legacy</h2>
  <button id="startBtn">START</button><br><br>
  <button id="resetBtn">DATA RESET</button>
</div>

<!-- 인트로 -->
<div id="introScreen" class="screen">
  <img id="mugshot">
  <div id="introText"></div>
  <div id="hint">화면을 터치하면 계속</div>
  <button id="skipBtn">SKIP</button>
</div>

<script src="data.js"></script>
<script>
loadPlayerData();

/* DOM */
const titleScreen = document.getElementById("titleScreen");
const introScreen = document.getElementById("introScreen");
const textEl = document.getElementById("introText");
const mugshot = document.getElementById("mugshot");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");
const skipBtn = document.getElementById("skipBtn");

/* 스토리 */
const story = [
  "매버릭 전쟁이 끝나고 30년 후...",
  "그러나 제로는 실종되었다."
];

const dialogue = [
  "엑스: 제로는 어디에 있는 거지?",
  "에이리아: 아직 위치를 파악하지 못했어."
];

let mode = "story";
let line = 0;
let char = 0;
let typing = false;
let timer;
const speed = 35;

startBtn.onclick = () => {
  titleScreen.classList.remove("active");
  introScreen.classList.add("active");
  resetTyping();
  updateMugshot();
  typeText();
};

function updateMugshot() {
  mugshot.style.display = "none";
  if (mode !== "dialogue") return;

  const t = dialogue[line];
  if (t.startsWith("엑스:")) mugshot.src = "images/X_mugshot.png";
  else if (t.startsWith("에이리아:")) mugshot.src = "images/Alia_mugshot.png";
  mugshot.style.display = "block";
}

function typeText() {
  typing = true;
  const src = mode === "story" ? story : dialogue;
  if (char < src[line].length) {
    textEl.textContent += src[line][char++];
    timer = setTimeout(typeText, speed);
  } else typing = false;
}

function nextLine() {
  if (typing) {
    clearTimeout(timer);
    typing = false;
    return;
  }

  line++;
  const src = mode === "story" ? story : dialogue;

  if (line < src.length) {
    resetTyping();
    updateMugshot();
    typeText();
  } else if (mode === "story") {
    mode = "dialogue";
    line = 0;
    resetTyping();
    updateMugshot();
    typeText();
  } else location.href = "select.html";
}

function resetTyping() {
  clearTimeout(timer);
  char = 0;
  textEl.textContent = "";
}

introScreen.addEventListener("touchstart", nextLine);

skipBtn.onclick = () => location.href = "select.html";

resetBtn.onclick = () => {
  if (confirm("모든 진행 상황을 초기화할까요?")) {
    localStorage.removeItem("playerData");
    location.reload();
  }
};
</script>

</body>
</html>
